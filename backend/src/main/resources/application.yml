spring:
  application:
    name: kodomo-inputcheck
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kodomo}
    username: ${SPRING_DATASOURCE_USERNAME:kodomo}
    password: ${SPRING_DATASOURCE_PASSWORD:kodomo}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
